---
# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: fedora-messaging-config
  namespace: communishift-public-inbox-poc
data:
  config.toml: |
    amqp_url = "amqps://fedora:@rabbitmq.fedoraproject.org/%2Fpublic_pubsub"
    callback = "consumer:GitReceiveConsumer"
    passive_declares = false

    [tls]
    ca_cert = "/etc/fedora-messaging/cacert.pem"
    keyfile = "/etc/fedora-messaging/fedora-key.pem"
    certfile = "/etc/fedora-messaging/fedora-cert.pem"

    [client_properties]
    app = "public-inbox-consumer"
    app_url = "https://public-inbox-communishift-public-inbox-poc.apps.fedora.cj14.p1.openshiftapps.com"

    [exchanges."amq.topic"]
    type = "topic"
    durable = true
    auto_delete = false
    arguments = {}

    [[bindings]]
    exchange = "amq.topic"
    routing_keys = ["org.fedoraproject.prod.git.receive"]

    [consumer_config]
    public_inbox_dir = "/var/lib/public-inbox"
    list_address = "git-commits@fedoraproject.org"

    [qos]
    prefetch_size = 0
    prefetch_count = 1

    [monitoring]
    port = 8081

    [log_config]
    version = 1
    disable_existing_loggers = true

    [log_config.formatters.simple]
    format = "[%(levelname)s %(name)s] %(message)s"

    [log_config.handlers.console]
    class = "logging.StreamHandler"
    formatter = "simple"
    stream = "ext://sys.stdout"

    [log_config.loggers.fedora_messaging]
    level = "INFO"
    propagate = false
    handlers = ["console"]

    [log_config.loggers.twisted]
    level = "INFO"
    propagate = false
    handlers = ["console"]

    [log_config.loggers.pika]
    level = "WARNING"
    propagate = false
    handlers = ["console"]

    [log_config.root]
    level = "ERROR"
    handlers = ["console"]
